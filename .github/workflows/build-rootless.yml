name: Build rootless beta package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: brew install dpkg ldid

      - name: Install Theos and iPhoneOS SDKs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_SDKS_PATH=$HOME/theos-sdks" >> "$GITHUB_ENV"

      - name: Build rootless IPA and Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EZCompleteUI-beta-rootless
          path: |
            packages/*.deb
            EZCompleteUI.ipa
          if-no-files-found: error
